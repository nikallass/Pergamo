name: Release APK

# Builds the signed opensource-flavor APK and attaches it to a GitHub Release.
# Runs on every v* tag, or by hand from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version from gradle.properties
        run: |
          VERSION_CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          cp keystore.jks app/keystore.jks

      - name: Build opensource release APK
        env:
          CI: true
          ANDROID_KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleOpensourceRelease

      - name: Name and verify the APK
        run: |
          APK=$(ls app/build/outputs/apk/opensource/release/*.apk | head -n 1)
          OUT="Pergamo-v${APP_VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_PATH }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pergamo ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install
            Download `${{ env.APK_PATH }}` below and open it on the phone. Android will ask to allow installs from your browser or file manager.

            - Flavor: `opensource` (Tesseract OCR, no Google Play Services, no network permission)
            - versionName `${{ env.APP_VERSION_NAME }}`, versionCode `${{ env.APP_VERSION_CODE }}`
            - Min Android 8.0 (API 26)
            - Signed with this repository's key: install alongside, not over, a store build.
          files: |
            ${{ env.APK_PATH }}
            ${{ env.APK_PATH }}.sha256
          draft: false
          prerelease: false
